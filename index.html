<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <title>My Gym</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1 id="screen-title">Today</h1>
  </header>

  <main>
    <section id="screen-today" class="screen active">
      <div class="card">
        <p class="label">Next workout</p>
        <h2>Coming in step 2</h2>
        <p class="muted">Your Upper / Lower plan will show up here.</p>
      </div>
    </section>

    <section id="screen-workout" class="screen">
      <div class="card">
        <p class="label">Workout</p>
        <h2>Coming in step 3</h2>
        <p class="muted">Log sets, reps and kg here.</p>
      </div>
    </section>

    <section id="screen-progress" class="screen">
      <div class="card">
        <p class="label">Progress</p>
        <h2>Coming in step 5</h2>
        <p class="muted">Charts, calendar and muscle overview.</p>
      </div>
    </section>
  </main>

  <nav class="tab-bar">
    <button class="tab active" data-screen="today">
      <span class="tab-icon">🏠</span>Today
    </button>
    <button class="tab" data-screen="workout">
      <span class="tab-icon">🏋️</span>Workout
    </button>
    <button class="tab" data-screen="progress">
      <span class="tab-icon">📈</span>Progress
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
