<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <title>My Gym</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Icon set, drawn for this app. Rules that keep them consistent:
    24x24 grid, 2px rounded outline, and exactly one solid shape per icon.
    Use one with: <svg class="icon"><use href="#i-name"/></svg>
  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-today" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="15.5" rx="4.5"/>
          <path d="M8 3v4M16 3v4"/>
        </g>
        <circle cx="12" cy="13.5" r="2.6" fill="currentColor"/>
      </symbol>

      <symbol id="i-workout" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 12h7M2.5 10v4M21.5 10v4"/>
          <rect x="15.5" y="6.5" width="3.5" height="11" rx="1.75"/>
        </g>
        <rect x="4" y="5.5" width="5.5" height="13" rx="2.75" fill="currentColor"/>
      </symbol>

      <symbol id="i-progress" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 16.5l5.5-5.5 4 3.5L18 8M3 21h18"/>
        </g>
        <circle cx="19" cy="6.5" r="2.6" fill="currentColor"/>
      </symbol>

      <symbol id="i-streak" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5c.5 4 5.5 6 5.5 11.500a5.500 5.500 0 0 1-11 0c0-2.200 1-3.800 2.200-5 .3 1.500 1 2.300 2 2.700C10.200 8.500 10.800 5.500 12 2.500z"/>
        </g>
        <circle cx="12" cy="15.500" r="2.200" fill="currentColor"/>
      </symbol>

      <symbol id="i-sessions" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 1.500v3M12 19.500v3"/>
        </g>
        <circle cx="12" cy="12" r="3.200" fill="currentColor"/>
      </symbol>

      <symbol id="i-swap" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.500 8h14M14 4.500 17.500 8 14 11.500M20.500 16H10"/>
        </g>
        <circle cx="5.500" cy="16" r="2.200" fill="currentColor"/>
      </symbol>

      <symbol id="i-go" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h11M15.500 7l5 5-5 5"/>
        </g>
        <circle cx="4.500" cy="12" r="2.200" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <header class="top-bar">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="screen-title">Today</h1>
  </header>

  <main>
    <!-- TODAY -->
    <section id="screen-today" class="screen active">
      <div class="week" id="week"></div>

      <div class="hero">
        <p class="hero-label" id="hero-label">Next up</p>
        <h2><span id="hero-day"></span><br><span id="hero-name"></span></h2>
        <p class="hero-note" id="hero-note"></p>
        <button class="btn" id="start-btn">
          Start workout
          <svg class="icon"><use href="#i-go"/></svg>
        </button>
      </div>

      <div class="plan-card">
        <div class="plan-head">
          <p class="section-label">The work</p>
          <button class="swap" id="swap-btn">
            <svg class="icon"><use href="#i-swap"/></svg>
            <span id="swap-text"></span>
          </button>
        </div>
        <ol class="exercises" id="exercise-list"></ol>
      </div>

      <div class="tiles">
        <div class="tile">
          <svg class="icon tile-icon heat"><use href="#i-streak"/></svg>
          <p class="tile-number">0</p>
          <p class="tile-label">Week streak</p>
        </div>
        <div class="tile">
          <svg class="icon tile-icon"><use href="#i-sessions"/></svg>
          <p class="tile-number">0<span id="sessions-goal"></span></p>
          <p class="tile-label">Sessions this week</p>
        </div>
      </div>
    </section>

    <!-- WORKOUT -->
    <section id="screen-workout" class="screen">
      <div class="empty">
        <svg class="art art-barbell" viewBox="0 0 200 90" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 45h172"/>
            <rect x="150" y="23" width="12" height="44" rx="6"/>
            <rect x="26" y="29" width="10" height="32" rx="5"/>
            <rect x="164" y="29" width="10" height="32" rx="5"/>
          </g>
          <rect class="art-solid" x="38" y="15" width="16" height="60" rx="8"/>
        </svg>
        <h2>Bar is empty</h2>
        <p>Logging sets, reps and kg arrives in step 3.</p>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="screen-progress" class="screen">
      <div class="empty">
        <svg class="art art-chart" viewBox="0 0 200 90" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 82h160"/>
            <rect class="bar" x="34" y="56" width="22" height="20" rx="7"/>
            <rect class="bar" x="70" y="44" width="22" height="32" rx="7"/>
            <rect class="bar" x="106" y="30" width="22" height="46" rx="7"/>
          </g>
          <rect class="art-solid bar" x="142" y="12" width="22" height="64" rx="7"/>
        </svg>
        <h2>No lifts yet</h2>
        <p>Your charts start growing after your first logged workout.</p>
      </div>
    </section>
  </main>

  <nav class="tab-bar" id="tab-bar">
    <span class="tab-pill" aria-hidden="true"></span>
    <button class="tab active" data-screen="today">
      <svg class="icon"><use href="#i-today"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-screen="workout">
      <svg class="icon"><use href="#i-workout"/></svg>
      <span>Workout</span>
    </button>
    <button class="tab" data-screen="progress">
      <svg class="icon"><use href="#i-progress"/></svg>
      <span>Progress</span>
    </button>
  </nav>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
