<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: the workout icon from the app's own set, big on warm black.
       Full square on purpose: iPhone rounds the corners itself. -->
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#d4ff3f" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#d4ff3f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#12100e"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Same drawing as #i-workout, scaled from the 24px grid -->
  <g transform="translate(64 64) scale(16)">
    <g fill="none" stroke="#f5f0e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 12h7M2.5 10v4M21.5 10v4"/>
      <rect x="15.5" y="6.5" width="3.5" height="11" rx="1.75"/>
    </g>
    <rect x="4" y="5.5" width="5.5" height="13" rx="2.75" fill="#d4ff3f"/>
  </g>
</svg>
